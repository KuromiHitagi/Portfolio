<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotas</title>

    <style>
        body{
            overflow: hidden;
            background-color: #999999;
        }
        main{
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: space-around;

            a{
                text-decoration: none;
                color: black;
                transition: all ease 0.4s;

                &:hover{
                    color: #fff;
                    transform: scale(1.5);
                }
            }
        }
    </style>
</head>
<body>
    <main>
        <a href="./waluigi/index.html">Waluigi</a>

        <a href="./wario/index.html">Wario</a>
    </main>
</body>
</html>
